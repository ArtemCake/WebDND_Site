<!-- frontend/templates/login.html -->

{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<div class="auth-container">
	<h2>Вход в аккаунт</h2>
	
	<!-- ВАЖНО: У сообщения должен быть именно такой ID -->
	<div id="message-box"></div>
	
	<form id="login-form" hx-post="/auth/login" hx-trigger="submit" method="post">
		<input type="email" name="email" placeholder="Email" required autocomplete="username">
		<input type="password" name="password" placeholder="Пароль" required autocomplete="current-password">
		<button type="submit">Войти</button>
	</form>
	
	<form id="mfa-code-form" class="hidden" hx-post="/auth/login/verify-mfa" hx-trigger="submit" hx-swap="none" method="post">
		<input type="hidden" name="mfa_token" id="mfa-token-field" value="">
		<p>Введите код из приложения-аутентификатора или резервный код</p>
		<input type="text" name="code" placeholder="Код" required autocomplete="one-time-code" inputmode="numeric">
		<button type="submit">Подтвердить</button>
	</form>
	<p><a href="/forgot-password"
	      hx-get="/forgot-password"
	      hx-target="body"
	      hx-push-url="true">Забыли пароль?</a></p>
	
	<p><a href="/register"
	      hx-get="/register"
	      hx-target="body"
	      hx-push-url="true">Нет аккаунта? Регистрация</a></p>
</div>
{% endblock %}
