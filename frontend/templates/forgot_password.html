<!-- frontend/templates/forgot_password.html -->

{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="auth-container">
	<h2>Восстановление пароля</h2>
	<p>Укажи email, на который зарегистрирован аккаунт — пришлём ссылку для сброса пароля.</p>
	
	<div id="message-box"></div>
	
	<form hx-post="/auth/forgot-password"
	      hx-trigger="submit"
	      method="post">
		
		<input type="email" name="email" placeholder="Email" required autocomplete="username">
		
		<button type="submit">Отправить ссылку</button>
	</form>
	
	<p><a href="/login" hx-get="/login" hx-target="body" hx-push-url="true">Вспомнил пароль? Войти</a></p>
</div>
{% endblock %}
