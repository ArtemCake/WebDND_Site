<!-- frontend/templates/games/games.html -->

{% extends "base.html" %}

{% block content %}
<section class="lobby-page">
	<header class="lobby-page__header">
		<h1>Мои игры</h1>
		<button type="button" class="btn btn-primary" data-lobby-action="create-game-open">Создать игру</button>
	</header>
	
	<div id="message-box-lobby"></div>
	
	<section class="lobby-join">
		<h2>Присоединиться по приглашению</h2>
		<div class="lobby-join__row">
			<input type="text" id="lobby-invite-token-input" placeholder="Вставьте токен приглашения" maxlength="64">
			<button type="button" class="btn btn-outline-primary" data-lobby-action="claim-invite">Присоединиться</button>
		</div>
	</section>
	
	<div id="games-list" class="lobby-grid">
		<p id="games-empty" class="lobby-empty hidden">У вас пока нет игр — создайте первую или присоединитесь по приглашению.</p>
	</div>
</section>

<!-- Модалка создания игры -->
<div id="lobby-create-modal" class="lobby-modal hidden">
	<div class="modal-box">
		<h2>Новая игра</h2>
		<form id="lobby-create-form">
			<label>
				Название
				<input type="text" name="title" required maxlength="255">
			</label>
			<label>
				Описание
				<textarea name="description" maxlength="2000"></textarea>
			</label>
			<label>
				Игровая система
				<select name="system_id" id="lobby-system-select" required>
					<option value="" disabled selected>Загрузка...</option>
				</select>
			</label>
			<label>
				Приватность
				<select name="privacy_level">
					<option value="private">Приватная</option>
					<option value="invite_only" selected>По приглашению</option>
					<option value="friends_only">Только друзья</option>
					<option value="public">Публичная</option>
				</select>
			</label>
			<label class="lobby-checkbox">
				<input type="checkbox" name="is_homebrew_allowed">
				Разрешить самодельный контент (homebrew)
			</label>
			<div id="message-box-lobby-create"></div>
			<div class="modal-actions">
				<button type="button" class="btn btn-outline-primary" data-lobby-action="create-game-close">Отмена</button>
				<button type="submit" class="btn btn-primary">Создать</button>
			</div>
		</form>
	</div>
</div>

<!-- Модалка приглашения -->
<div id="lobby-invite-modal" class="lobby-modal hidden">
	<div class="lobby-modal__dialog">
		<h2>Пригласить игрока</h2>
		<form id="lobby-invite-form">
			<label>
				Срок действия
				<input type="datetime-local" name="expires_at">
			</label>
			<label>
				Лимит использований
				<input type="number" name="uses_limit" min="1" placeholder="например, 1">
			</label>
			<label>
				Сообщение приглашённому
				<input type="text" name="message" maxlength="500">
			</label>
			<div id="message-box-lobby-invite"></div>
			<div id="lobby-invite-result" class="hidden">
				<label>
					Токен приглашения
					<input type="text" id="lobby-invite-token-output" readonly>
				</label>
				<button type="button" class="btn btn-outline-primary" data-lobby-action="copy-invite">Скопировать</button>
			</div>
			<div class="lobby-modal__actions">
				<button type="button" class="btn btn-outline-primary" data-lobby-action="invite-close">Закрыть</button>
				<button type="submit" class="btn btn-primary">Создать приглашение</button>
			</div>
		</form>
	</div>
</div>
{% endblock %}
