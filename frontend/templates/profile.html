<!--  frontend/templates/profile.html -->

{% extends "base.html" %}
{% block title %}Профиль{% endblock %}

{% block content %}
<div class="">
	<h2 class="">Настройки профиля</h2>
	
	<!-- Блок персональных данных -->
	<div id="profile-form-section" hx-target="this" hx-swap="outerHTML">
		<form
				hx-put="/profile/update"
				hx-target="#message-box-profile"
				hx-swap="innerHTML"
				hx-trigger="submit"
				enctype="multipart/form-data"
				class="">
			
			<div class="">
				<!-- Аватар -->
				<label class="relative">
					<img src="{{ user.avatar_url or '/frontend/static/image/default-avatar.jpg' }}"
					     alt="Аватар"
					     class="">
					<input type="file" name="avatar" accept="image/*" class="hidden" onchange="previewAvatar(event)">
					<button type="button" class="">
						Изменить
					</button>
				</label>
				
				<!-- Текстовые поля -->
				<div class="flex-1 grid gap-4">
					<div>
						<label for="nickname" class="block text-sm font-medium text-text-secondary">Никнейм</label>
						<input type="text" id="nickname" name="nickname" value="{{ user.nickname }}" required
						       class="m">
					</div>
					<div>
						<label for="email" class="block text-sm font-medium text-text-secondary">Email</label>
						<input type="email" id="email" name="email" value="{{ user.email }}" required
						       class="">
					</div>
				</div>
			</div>
			
			<div id="message-box-profile" class="min-h-6"></div>
			
			<div class="pt-4 border-t border-border-subtle flex justify-end">
				<button type="submit"
				        class="">
					Сохранить изменения
				</button>
			</div>
		</form>
	</div>
	
	<!-- Блок смены пароля -->
	<div class="">
		<h3 class="">Безопасность</h3>
		
		<div id="password-form-section" hx-target="this" hx-swap="outerHTML">
			<form
					hx-post="/profile/change-password"
					hx-target="#message-box-password"
					hx-swap="innerHTML"
					hx-trigger="submit"
					class="">
				
				<div>
					<label for="current_pass" class="block text-sm font-medium text-text-secondary">Текущий пароль</label>
					<input type="password" id="current_pass" name="current_password" required
					       class="">
				</div>
				<div>
					<label for="new_pass" class="block text-sm font-medium text-text-secondary">Новый пароль</label>
					<input type="password" id="new_pass" name="new_password" required minlength="8"
					       class="">
				</div>
				
				<div id="message-box-password" class="min-h-6"></div>
				
				<button type="submit"
				        class="">
					Изменить пароль
				</button>
			</form>
		</div>
	</div>
</div>
{% endblock %}

{% block scripts %}
<script>
	function previewAvatar(event) {
		const input = event.target;
		if (input.files && input.files[0]) {
			const reader = new FileReader();
			reader.onload = function(e) {
				// Находим предыдущее изображение и меняем его src
				document.querySelector('#profile-form-section img').src = e.target.result;
			}
			reader.readAsDataURL(input.files[0]);
		}
	}
</script>
{% endblock %}
