<!-- frontend/templates/base.html -->

<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8">
	<title>{% block title %}WebDND{% endblock %}</title>
	<script src="https://unpkg.com/htmx.org@2.0.4"></script>
	<link rel="stylesheet" href="{{ static_url('css/style.min.css') }}">
	<link rel="icon" href="{{ static_url('images/favicon.ico') }}" type="image/x-icon">
</head>
<header class="site-header">
	<!-- Подключение меню навигации -->
	{% include "menu.html" %}
</header>
<body class="auth-body">

<!-- БЛОК СООБЩЕНИЙ (ИСПРАВЛЕНО ДЛЯ FASTAPI) -->
{% set messages = request.session.pop('_flashes', []) if '_flashes' in request.session else [] %}
{% if messages %}
<div id="global-message-box">
	{% for category, message in messages %}
	<div class="alert alert-{{ category }}">{{ message }}</div>
	{% endfor %}
</div>
{% endif %}

<!-- Центральный контейнер формы -->
<div class="auth-container page-content">
	{% block content %}{% endblock %}
</div>

<script type="module" src="{{ static_url('js/main.min.js') }}"></script>
</body>
</html>
