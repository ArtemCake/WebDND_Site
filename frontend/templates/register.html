<!-- frontend/templates/register.html -->

{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h2>Создание аккаунта</h2>

<!-- ВАЖНО: блок сообщения ПЕРЕД формой и с нужным ID -->
<div id="message-box"></div>

<form hx-post="/auth/register"
      hx-trigger="submit"
      method="post">
	<input type="text" name="nickname" placeholder="Никнейм" required>
	<input type="email" name="email" placeholder="Email" required>
	<input type="password" name="password" placeholder="Пароль" required>
	<button type="submit">Зарегистрироваться</button>
</form>

<p><a href="/login"
      hx-get="/login"
      hx-target="body"
      hx-push-url="true">Уже есть аккаунт? Вход</a></p>
{% endblock %}
