{# frontend/templates/partials/session_dice.html #}

<section
		class="session-dice"
		data-session-dice
		data-session-id="{{ session_id }}"
		aria-label="Кубики игровой сессии"
>
	<header class="session-dice__header">
		<h2>Кубики</h2>
		<button
				type="button"
				class="btn btn-outline-primary"
				data-session-dice-refresh
		>
			Обновить журнал
		</button>
	</header>
	
	<form data-session-dice-form>
		<fieldset class="session-dice__fields">
			<legend>Новый бросок</legend>
			
			<label class="session-dice__field">
				Формула
				<input
						type="text"
						name="formula"
						value="1d20"
						placeholder="Например, 2d6+3"
						maxlength="100"
						autocomplete="off"
						spellcheck="false"
						required
				>
				<small class="session-dice__hint">
					Количество костей, d, число граней и необязательный
					модификатор: 1d20, 2d6+3, 1d20-2.
				</small>
			</label>
			
			<label class="session-dice__field">
				Режим
				<select name="advantage">
					<option value="">Обычный бросок</option>
					<option value="advantage">Преимущество</option>
					<option value="disadvantage">Помеха</option>
				</select>
				<small class="session-dice__hint">
					Преимущество и помеха доступны только для 1d20,
					в том числе с модификатором.
				</small>
			</label>
			
			<button type="submit" class="btn btn-primary">
				Бросить
			</button>
		</fieldset>
	</form>
	
	<div
			data-session-dice-message
			role="status"
			aria-live="polite"
			aria-atomic="true"
	></div>
	
	<section class="session-dice__history" aria-label="Журнал бросков">
		<h3>Журнал бросков</h3>
		<p class="session-dice__hint" data-session-dice-empty>
			Журнал ещё не загружен.
		</p>
		<ol class="session-dice__list" data-session-dice-list></ol>
	</section>
</section>
