<!-- frontend/templates/reset_password.html -->

{% extends "base.html" %}
{% block title %}Новый пароль{% endblock %}
{% block content %}
<div class="auth-container">
	<h2>Новый пароль</h2>
	
	<div id="message-box"></div>
	
	{% if reset_token %}
	<form hx-post="/auth/reset-password"
	      hx-trigger="submit"
	      method="post">
		
		<input type="hidden" name="token" value="{{ reset_token }}">
		<input type="password" name="new_password" placeholder="Новый пароль" required
		       autocomplete="new-password" minlength="8">
		
		<button type="submit">Сохранить новый пароль</button>
	</form>
	{% else %}
	<p>Ссылка повреждена: не хватает токена восстановления. Запроси новую ссылку на
		<a href="/forgot-password" hx-get="/forgot-password" hx-target="body" hx-push-url="true">странице восстановления пароля</a>.</p>
	{% endif %}
</div>
{% endblock %}
