# alembic.ini

[alembic]
# Явно указываем URL БД (будет подставляться в коде)
sqlalchemy.url =

# Путь к миграциям — укажите корректный путь
script_location = versions

# Добавляем поддержку асинхронных миграций
prepend_sys_path = .

# Настройки логирования — повышаем детализацию
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
